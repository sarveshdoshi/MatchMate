included:
  - ShubhAstro
  - ShubhAstroTests

excluded:
  - .build
  - DerivedData

disabled_rules:
  - trailing_whitespace
  - todo

opt_in_rules:
  - force_unwrapping
  - empty_count
  - explicit_init
  - closure_spacing
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - empty_string
  - fatal_error_message
  - first_where
  - last_where
  - modifier_order
  - overridden_super_call
  - private_action
  - private_outlet
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

line_length:
  warning: 120
  error: 200

type_body_length:
  warning: 250
  error: 400

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 40
  error: 80

cyclomatic_complexity:
  warning: 10
  error: 15

identifier_name:
  min_length: 3
  max_length: 50
  excluded:
    - id
    - to
    - on

nesting:
  type_level: 2
  function_level: 3

reporter: xcode
